name: Release

# A release is cut by pushing a version tag:
#
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# This builds the sdist + wheel, checks that the tag matches
# neurolab.__version__, attaches the artifacts to a GitHub Release, and
# (opt-in) publishes to PyPI.
#
# PyPI publishing is gated behind the repository variable PYPI_PUBLISH so the
# workflow never fails on a repo that has not configured trusted publishing
# yet. To enable it:
#   1. PyPI -> Account -> Publishing -> add a trusted publisher for the
#      "neurolab-cli" project: owner amirhaghani-brain, repo neuro-lab,
#      workflow release.yml, environment pypi.
#   2. GitHub -> Settings -> Secrets and variables -> Actions -> Variables ->
#      add PYPI_PUBLISH = true

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Verify tag matches neurolab.__version__
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          source = pathlib.Path("src/neurolab/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
              sys.exit("could not find __version__ in src/neurolab/__init__.py")
          version = match.group(1)
          if version != tag:
              sys.exit(
                  f"tag v{tag} does not match neurolab.__version__ ({version}); "
                  "bump src/neurolab/__init__.py before tagging"
              )
          print(f"OK: tag v{tag} matches neurolab.__version__")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import neurolab; print('built version:', neurolab.__version__)"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refreshing assets"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neurolab-cli
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
