[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-lab"
version = "0.1.0"
description = "A modern terminal-native computational neuroscience workspace, dashboard, and toolchain orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Amir" },
]
keywords = ["computational-neuroscience", "tui", "textual", "brian2", "neuron", "nengo", "snntorch", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
all = [
    "brian2",
    "neuron",
    "nengo",
    "nengo-gui",
    "snntorch",
    "elephant",
    "neo",
    "jupyterlab",
    "matplotlib",
    "numpy",
]

[project.scripts]
neurolab = "neurolab.cli:main"
lab = "neurolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neurolab" = ["templates/*", "templates/**/*", "tui/*.tcss"]
