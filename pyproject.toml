[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolab-cli"
dynamic = ["version"]
description = "A modern terminal-native computational neuroscience workspace, dashboard, and toolchain orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Amir Haghani" },
]
keywords = ["computational-neuroscience", "tui", "textual", "brian2", "neuron", "nengo", "snntorch", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "prompt_toolkit>=3.0.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
]
all = [
    "brian2",
    "neuron",
    "nengo",
    "nengo-gui",
    "snntorch",
    "elephant",
    "neo",
    "jupyterlab",
    "matplotlib",
    "numpy",
]

[project.scripts]
neurolab = "neurolab.cli:main"
lab = "neurolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Single source of truth for the version: neurolab.__version__.
# Bump that one string, tag the commit, and the release workflow publishes it.
[tool.setuptools.dynamic]
version = { attr = "neurolab.__version__" }

[tool.setuptools.package-data]
"neurolab" = ["templates/*", "templates/**/*", "tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# nengo ships a pytest plugin whose hooks are incompatible with pytest >= 8;
# disable it so the suite still runs when nengo is installed (e.g. via [all]).
addopts = "-q -p no:nengo"
